<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RS Financial Client Dashboard</title>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f8fafc; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    import React from 'react';


    const Navbar = () => {
      return (
        <nav style={styles.navbar}>
          <div style={styles.logo}>RoyalDashBoard</div>
          <ul style={styles.navLinks}>
            <li><a href="#Networth" style={styles.link}>Overview</a></li>  #THis should show how your money is used, the dashboae=rds of how much do you have, etc
            <li><a href="#MakeaClaim" style={styles.link}>Analytics</a></li> # The Client should meet all the requirements in the doc
            <li><a href="#TrackYourClaim" style={styles.link}>Settings</a></li> # The client should be able to track their claim and see which stage they are currently in
            <li><a href="#BookaConsultation" style={styles.link}>Settings</a></li> # The client should be able to book a consultation and see the consultation fees, this should then go to te empoyees DB and see which slots to show the client that are available based on the employees availability
            <li><a href="#UpdateYourProfile" style={styles.link}>Settings</a></li>  # This needs to have avery high security bcz it also contain a very confidential info and updating means they will see so we need to make sure it is the client
          </ul>
        </nav>
      );
    };

    const styles = {
      navbar: { display: 'flex', justifyContent: 'space-between', padding: '1rem 2rem', background: '#8F011B', color: '#fff', alignItems: 'center' },
      logo: { fontWeight: 'bold', fontSize: '1.25rem' },
      navLinks: { display: 'flex', listStyle: 'none', gap: '1.5rem', margin: 0, padding: 0 },
      link: { color: '#cbd5e1', textDecoration: 'none' }
    };

    const ClientDashBoard = () => {
        return (
            <div>
                <Navbar />
                <main style={{ padding: '2.5rem' }}>
                    <h1 style={{ color: '#D4AF37', margin: 0 }}>Welcome to RS-Financial Portal</h1>
                    <p style={{ color: '#64748b', marginTop: '0.5rem' }}>Your custom navigation panel is up and running perfectly.</p>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClientDashBoard />);
</script>
</body>
</html>
